---
- name: install git server (web)
  hosts: gitsrv
  become_user: root
  become_method: sudo
  become: yes
  vars:
    repo_root: "/opt/git"
    githost_user: "git"

  tasks:
  - name: install required packages
    package: name={{item}} state=present
    with_items:
      - git
      - tmux
      - nginx

  - name: nginx config
    copy:
      src: '../files/nginx.default'
      dest: '/etc/nginx/sites-available/default'
      owner: root
      group: root
      mode: 0644

  - name: configure nginx
    service:
      name: nginx
      state: restarted
      enabled: yes

  - name: install GOGS
    unarchive:
      src: https://dl.gogs.io/gogs_v0.9.128_linux_amd64.tar.gz
      dest: /opt/
      remote_src: True
      owner: git
      group: git

  - name: add git user
    user:
      name: git
      shell: /bin/bash
      state: present
  
  - name: set git root repo path
    file:
      path: /opt/git
      state: directory
      mode: 0770
      owner: git
      group: git
