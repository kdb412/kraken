---
- hosts: all
  user: ubuntu
  tasks:
    - name: install packages
      apt: name={{ item }} state=installed
      with_items:
          - git
          - make
          - clang
          - unzip
          - lighttpd
          - libcgi-fast-perl

    - name: copy git source
      copy: src=git.zip dest=/opt/git-src.zip
      register: gitsrc

    - name: create git-src folder
      file: path=/opt/git-src/ state=directory

    - name: extract git source
      unarchive: src=/opt/git-src.zip dest=/opt/git-src/ copy=no
      when: gitsrc.changed
 
    - name: configure gitweb scripts
      command: "make -C /opt/git-src/git/ GITWEB_PROJECTROOT=/opt/git/ prefix=/usr gitweb"
      when: gitsrc.changed

    - name: copy gitweb scripts to web server path
      command: "mv /opt/git-src/git/gitweb /var/www/gitweb"
      when: gitsrc.changed

    - name: clean up git source
      file: path=/opt/git-src state=absent

    - name: creating root git path
      file: path=/opt/git state=directory

    - name: configure gitweb config
      copy: src=gitweb.conf dest=/etc/gitweb.con mode=0644

    - name: copy http server config
      copy: src=lighttpd.conf dest=/etc/lighttpd/lighttpd.conf mode=0644

    - name: create repo folder
      file: path=/opt/git/kraken state=directory

    - name: create git repo
      command: "git -C /opt/git/kraken init --bare"

    - name: repo file permission
      file: path="/opt/git/kraken" owner="ubuntu" group="ubuntu" mode="755" recurse=yes

    - name: link repo path
      file: dest="/home/ubuntu/kraken" src="/opt/git/kraken" state=link

    - name: project keys
      authorized_key:
        user: ubuntu
        state: present
        key: "{{ lookup('file', 'ssh-keys') }}"

    - name: restart lighttpd
      service: name=lighttpd state=restarted


